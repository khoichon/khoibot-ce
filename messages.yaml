# The messages that khoibot will use to communicate with users.
# Each message is a key-value pair, of which if there are multiple messages for a single key, they will be randomly selected from the list.
# This is being migrated from hardcoding to make it easier to "change khoibot's personality" in the future.

# Deny messages that can appear when a moderator asks khoibot to enable its help command.
